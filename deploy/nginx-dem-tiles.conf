# Hawaii DEM tile pyramid for the swim map, served from the same box as the
# site. Include this inside the site's `server { ... }` block, then:
#
#   rsync -av --progress data/hi_dem/ user@box:/var/www/hi_dem/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app fetches /tiles/<res>m/x<tx>_y<ty>.tif and /attrs/... relative to
# the page origin, so no VITE_DEM_BASE is needed when the paths below match.
# Tiles are DEFLATE-compressed GeoTIFF already, so gzip buys nothing; the
# index.json files are the only thing worth compressing.

location /tiles/ {
    alias /var/www/hi_dem/tiles/;
    types { image/tiff tif; application/json json; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_types application/json;
    try_files $uri =404;
}

location /attrs/ {
    alias /var/www/hi_dem/attrs/;
    types { image/tiff tif; application/json json; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_types application/json;
    try_files $uri =404;
}
